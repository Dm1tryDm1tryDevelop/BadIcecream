<script>
const $=i=>document.getElementById(i);
const T=32,W=15,H=11,DX=[0,1,0,-1],DY=[-1,0,1,0];
const cv=$('c');let cx=cv.getContext('2d');cv.width=W*T;cv.height=H*T;cx.imageSmoothingEnabled=false;
const SK=[{n:'Пломбир',c:'#fff4de',s:'#d8c3a0',p:0,cd:12,ab:'Заморозка',ds:'Замораживает врагов рядом на 3 с',t:0},
{n:'Голубика',c:'#8fb4ff',s:'#5a82d8',p:0,cd:7,ab:'Рывок',ds:'Прыжок на 3 клетки вперёд',t:1},
{n:'Клубника',c:'#ff8fb8',s:'#d95a8a',p:0,cd:10,ab:'Ускорение',ds:'Быстрый бег на 3 с',t:2},
{n:'Фисташка',c:'#9be36d',s:'#5fae3c',p:100,cd:14,ab:'Щит',ds:'Неуязвимость на 4 с',t:3},
{n:'Банан',c:'#ffe45c',s:'#d9b62a',p:100,cd:12,ab:'Магнит',ds:'Собирает фрукты вокруг',t:4},
{n:'Мята',c:'#7fe8d0',s:'#3fb59a',p:150,cd:10,ab:'Ледяное кольцо',ds:'Лёд со всех сторон',t:5},
{n:'Вишня',c:'#e8384f',s:'#a01830',p:200,cd:14,ab:'Взрыв',ds:'Крушит лёд и оглушает врагов',t:6}];
let ST={coins:0,own:[0,1,2],skin:0};
try{const s=JSON.parse(localStorage.getItem('bi_save')||'null');if(s)ST=Object.assign(ST,s)}catch(e){}
function save(){try{localStorage.setItem('bi_save',JSON.stringify(ST))}catch(e){}}
const LVo=[[
"###############","#P.....f.....Q#","#.##.#####.##.#","#.f..c...c..f.#","#.#.##.e.##.#.#","#...f.....f...#","#.#.##...##.#.#","#.f..c...c..f.#","#.##.#####.##.#","#.....f.....e.#","###############"],[
"###############","#P..f...c...Q.#","#.##.##.##.##.#","#.f.#..b..#.f.#","#.#...###...#.#","#c..f.#s#.f..c#","#.#...###...#.#","#.f.#..e..#.f.#","#.##.##.##.##.#","#..f...c...f..#","###############"],[
"###############","#P.f..#.#..f.Q#","#.##.##.##.##.#","#.#f.....c.f#.#","#...##.g.##...#","#c.f.e...b.f.c#","#...##.s.##...#","#.#f.....c.f#.#","#.##.##.##.##.#","#.f..#...#..f.#","###############"]];
const LV=[LVo[0].map((r,i)=>i==3?r.replace('c','e'):r),LVo[1].map(r=>r.replace('s','b')),LVo[2].map(r=>r.replace('g','r').replace('s','e')),['###############','#P.f.....c..fQ#','#.#.#.###.#.#.#','#f..j.#f#...f.#','#.##.##.##.##.#','#c.f..s..f...c#','#.##.##.##.##.#','#f...#.e.#j..f#','#.#.#.###.#.#.#','#..f.c...c.f..#','###############'],['###############','#P.f..#.#..f.Q#','#.##.##.##.##.#','#.#f..r..c.f#.#','#...##.g.##...#','#c.f.j...b.f.c#','#...##.s.##...#','#.#f..e..c.f#.#','#.##.##.##.##.#','#.f..#...#..f.#','###############']];
let G=null,role='solo',scr='menu',peer=null,conn=null,td=-1,kd=[],ld=-1,snapT=0,qt=0,bubT=0;
const PCFG={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}};

function R(c,ox,oy,u,x,y,w,h,col){c.fillStyle=col;c.fillRect(ox+x*u,oy+y*u,w*u,h*u)}
function drawIC(c,ox,oy,u,k,face,bob){const s=SK[k],q=(x,y,w,h,col)=>R(c,ox,oy+bob*u,u,x,y,w,h,col),fx=DX[face],fy=DY[face]>0?1:0,bk=face==0,pe=4+(fx>=0?1:0);
q(3,14,4,2,'#2a1408');q(9,14,4,2,'#2a1408');q(1,10,14,4,s.s);q(2,9,12,4,s.c);q(2,13,12,1,s.s);
q(3,5,10,4,s.c);q(3,8,10,1,s.s);q(5,2,6,3,s.c);q(5,4,6,1,s.s);const tp=SK[k].t;if(tp==0){q(7,0,2,2,'#e8263a');q(7,0,1,1,'#ff8a8a')}else if(tp==1){q(6,1,2,2,'#3a4fc0');q(9,0,2,2,'#3a4fc0');q(8,2,2,1,'#5a7aff')}else if(tp==2){q(6,1,4,2,'#ff4a5a');q(6,0,4,1,'#3fa83a');q(7,1,1,1,'#ffd23c')}else if(tp==3){q(6,1,2,2,'#8a5a2a');q(9,0,2,2,'#a8743a');q(10,0,1,1,'#d8a86a')}else if(tp==4){q(6,0,4,2,'#ffe070');q(7,0,2,1,'#fff3b0');q(6,1,4,1,'#c9a020')}else if(tp==5){q(5,1,3,2,'#2fb36a');q(8,0,3,2,'#46d985');q(7,2,2,1,'#1d7a48')}else{q(5,1,3,2,'#c01030');q(9,1,3,2,'#c01030');q(7,0,1,1,'#3a7a2a');q(8,1,1,1,'#3a7a2a')}q(0,11,1,2,s.s);q(15,11,1,2,s.s);
q(3,10,2,1,'#fff');q(4,6,2,1,'#fff');q(6,3,1,1,'#fff');q(11,11,1,1,'#ffd23c');q(2,12,1,1,'#ff4a6a');q(12,6,1,1,'#4ad0ff');q(5,8,1,1,'#7be34a');
if(!bk){q(4,9+fy,3,3,'#fff');q(9,9+fy,3,3,'#fff');q(pe,10+fy,2,2,'#2a1408');q(pe+5,10+fy,2,2,'#2a1408');q(4,8,4,1,'#2a1408');q(8,8,4,1,'#2a1408')}else{q(6,6,4,1,s.s);q(5,10,6,1,s.s)}}
function drawICold(c,ox,oy,u,k,face,bob){const s=SK[k],q=(x,y,w,h,col)=>R(c,ox,oy+bob*u,u,x,y,w,h,col),fx=DX[face]*1,fy=DY[face]>0?1:0;
q(2,13,12,2,s.s);q(2,10,12,4,s.c);q(4,9,8,1,s.s);q(4,6,8,3,s.c);q(6,5,4,1,s.s);q(6,3,4,2,s.c);q(7,1,2,2,s.c);q(3,11,2,1,'#fff');q(5,7,2,1,'#fff');
q(5+fx,11+fy,2,2,'#3a1c0a');q(9+fx,11+fy,2,2,'#3a1c0a');q(4,10,4,1,'#3a1c0a');q(8,10,4,1,'#3a1c0a');q(3,15,3,1,'#3a1c0a');q(10,15,3,1,'#3a1c0a')}
function mk(x,y,type){return{x,y,px:x,py:y,nx:x,ny:y,tx:x,ty:y,mv:0,t:0,dir:-1,type,pause:0,al:0,ch:0,brk:0}}
function ok(x,y){return x>=0&&y>=0&&x<W&&y<H}
function mv(e,d){e.tx=e.x+DX[d];e.ty=e.y+DY[d];e.mv=1;e.t=0;e.dir=d}
function mover(e,dt,sp,cb){if(!e.mv)return;e.t+=dt*sp;if(e.t>=1){e.x=e.tx;e.y=e.ty;e.px=e.x;e.py=e.y;e.mv=0;e.t=0;if(cb)cb(e)}else{e.px=e.x+(e.tx-e.x)*e.t;e.py=e.y+(e.ty-e.y)*e.t}}
function blank(n){return{n,sk:[ST.skin,0],time:0,pt:[],pl:[],en:[],fr:[],co:[],g:null,ib:null,score:0,cn:0,lives:1,lvl:0,state:'play',shown:0,intro:0,tm:150}}
function startGame(n,s2){G=blank(n);G.sk[1]=s2||0;loadLevel(0);show(null)}
function loadLevel(i){const L=LV[i],g=[],ib=[];G.fr=[];G.co=[];G.en=[];G.pl=[];const ps=[];
for(let y=0;y<H;y++){g.push([]);ib.push([]);const r=((L[y]||'')+'#'.repeat(W)).slice(0,W);
for(let x=0;x<W;x++){const ch=r[x];g[y].push(ch=='#'?1:0);ib[y].push(0);
if(ch=='f')G.fr.push({x,y});else if(ch=='c')G.co.push({x,y});else if('ebsgjr'.includes(ch))G.en.push(mk(x,y,'ebsgjr'.indexOf(ch)));else if(ch=='P')ps[0]=[x,y];else if(ch=='Q')ps[1]=[x,y]}}
G.g=g;G.ib=ib;G.lvl=i;G.intro=1.8;G.tm=150+i*15;G.cr={};G.q=[];
for(let k=0;k<G.n;k++){const s=ps[k]||ps[0];G.pl.push(Object.assign(mk(s[0],s[1],-1),{skin:G.sk[k],face:2,inp:-1,act:0,inv:0,sx:s[0],sy:s[1]}))}}
function occ(x,y){return G.pl.concat(G.en).some(e=>(e.x==x&&e.y==y)||(e.mv&&e.tx==x&&e.ty==y))}
function crumb(x,y){for(let i=0;i<10;i++)G.pt.push({x:x+.5,y:y+.5,vx:(Math.random()-.5)*5,vy:-Math.random()*4,l:.7,k:0});G.pt.push({x:x+.5,y:y+.5,vx:0,vy:0,l:.9,k:1})}
function brk(x,y){G.g[y][x]=0;if(G.cr)delete G.cr[y*W+x];crumb(x,y)}
function doAct(p){if(p.cd>0)return;const d=p.face;let x=p.x+DX[d],y=p.y+DY[d];if(!ok(x,y)||G.g[y][x]==1)return;

function act(){if(scr!='game'||!G)return;try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}if(role=='guest'){if(conn&&conn.open)conn.send({t:'i',a:1,d:ld})}else if(G.pl[0])G.pl[0].act=1}
const KM={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.code in KM){if(!kd.includes(KM[e.code]))kd.push(KM[e.code]);e.preventDefault()}else if(e.code=='Space'||e.code=='KeyZ'){act();e.preventDefault()}else if(e.code=='KeyC')toggleChat();else if(e.code=='KeyX'||e.code=='ShiftLeft')abil()});
addEventListener('keyup',e=>{if(e.code in KM)kd=kd.filter(k=>k!=KM[e.code])});
const dp=$('dp'),RT=[0,90,180,270];
for(let d=0;d<4;d++){const a=document.createElement('div');a.className='ar';a.dataset.d=d;a.innerHTML='<svg viewBox="0 0 24 24" style="transform:rotate('+RT[d]+'deg)"><path d="M12 5l9 13H3z" fill="#fff"/></svg>';a.style.cssText=['left:33%;top:4%','right:4%;top:33%','left:33%;bottom:4%','left:4%;top:33%'][d];dp.appendChild(a)}
function setTd(d){td=d;document.querySelectorAll('.ar').forEach(a=>a.classList.toggle('on',+a.dataset.d==d))}
let dpa=0;function dpm(e){const r=dp.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;let d=-1;if(Math.hypot(dx,dy)>r.width*.07){const hz=td==1||td==3;d=Math.abs(dx)*(hz?1.5:1)>Math.abs(dy)*(hz?1:1.5)?(dx>0?1:3):(dy>0?2:0)};setTd(d)}
dp.addEventListener('pointerdown',e=>{dpa=1;dp.setPointerCapture(e.pointerId);dpm(e)});
dp.addEventListener('pointermove',e=>{if(dpa)dpm(e)});
['pointerup','pointercancel'].forEach(n=>dp.addEventListener(n,()=>{dpa=0;setTd(-1)}));
const ba=$('ba');ba.addEventListener('pointerdown',e=>{ba.classList.add('pr');act()});['pointerup','pointercancel','pointerleave'].forEach(n=>ba.addEventListener(n,()=>ba.classList.remove('pr')));
const PH=['Привет!','Помоги!','Иду к тебе','Осторожно!','Отлично!','Стой на месте'];
PH.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p;b.onclick=()=>{say(i)};$('cm').appendChild(b)});
$('bc').addEventListener('pointerdown',e=>{e.preventDefault();toggleChat()});
const bs=$('bs');bs.addEventListener('pointerdown',e=>{e.preventDefault();bs.classList.add('pr');abil()});['pointerup','pointercancel','pointerleave'].forEach(n=>bs.addEventListener(n,()=>bs.classList.remove('pr')));
document.querySelectorAll('#bc').forEach(b=>{b.addEventListener('pointerdown',()=>b.classList.add('pr'));['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,()=>b.classList.remove('pr')))});
function toggleChat(){const c=$('cm');c.style.display=c.style.display=='flex'?'none':'flex'}
function bub(t){const b=$('bub');b.textContent=t;b.style.display='block';clearTimeout(bubT);bubT=setTimeout(()=>b.style.display='none',3000)}
function say(i){$('cm').style.display='none';bub('Вы: '+PH[i]);if(conn&&conn.open)conn.send({t:'c',m:i})}

function show(id){document.querySelectorAll('.scr').forEach(s=>s.style.display=s.id==id?'flex':'none');scr=id||'game';if(id=='menu')drawPrev();if(id=='shop')renderShop();$('cm').style.display='none'}
function drawPrev(){const c=$('mp').getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,96,96);drawIC(c,0,0,6,ST.skin,2,0);$('mc').textContent='МОНЕТЫ: '+ST.coins+'  '+SK[ST.skin].n+': '+SK[ST.skin].ab}
function renderShop(){$('sc').textContent='Монеты: '+ST.coins;const w=$('cards');w.innerHTML='';
SK.forEach((s,i)=>{const d=document.createElement('div'),own=ST.own.includes(i);d.className='card'+(ST.skin==i?' sel':'');
d.innerHTML='<canvas width="64" height="64" style="width:64px;height:64px;image-rendering:pixelated"></canvas><div>'+s.n+'</div><div class="sm"><b>'+s.ab+'</b><br>'+s.ds+'</div>';
drawIC(d.firstChild.getContext('2d'),0,0,4,i,2,0);
const b=document.createElement('button');b.className='btn'+(own?'':' o');b.textContent=ST.skin==i?'ВЫБРАНО':own?'ВЫБРАТЬ':'КУПИТЬ '+s.p;
b.onclick=()=>{if(own){ST.skin=i}else if(ST.coins>=s.p){ST.coins-=s.p;ST.own.push(i);ST.skin=i;$('sm').textContent='Куплено: '+s.n}else{$('sm').textContent='Не хватает монет. Собирайте их на уровнях.';return}save();renderShop()};
d.appendChild(b);w.appendChild(d)})}
function showEnd(k){const T2={win:'ПОБЕДА!',over:'ВАС РАЗДАВИЛИ',lost:'НАПАРНИК ОТКЛЮЧИЛСЯ'};$('et').textContent=T2[k];$('es').textContent=G?'Очки: '+G.score+'   Монеты за забег: '+G.cn:'';$('ag').style.display=(role=='guest'||k=='lost')?'none':'block';show('end')}
function play(){cleanNet();startGame(1)}
function again(){if(role=='host'&&conn&&conn.open){startGame(2,G.sk[1]);conn.send({t:'start',skin:ST.skin})}else startGame(1)}
function goMenu(){cleanNet();G=null;show('menu')}
function goOnline(){$('stt').textContent='Быстрая игра сама соединит двух игроков. Код — всего 3 символа.';$('code').textContent='';$('link').textContent='';show('online')}
function goShop(){show('shop')}

function st(t){$('stt').textContent=t}
function rc(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<3;i++)s+=a[Math.random()*a.length|0];return s}
function loadPeer(cb){if(window.Peer)return cb();st('Загрузка сетевого модуля...');const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';s.onload=cb;s.onerror=()=>st('Нет доступа к сети');document.head.appendChild(s)}
function cleanNet(){const p=peer,c=conn;conn=null;peer=null;role='solo';try{c&&c.close()}catch(e){}try{p&&p.destroy()}catch(e){}}
function hostRoom(code,q){cleanNet();st('Создаём комнату...');const p=peer=new Peer('bic-'+code,PCFG);
p.on('open',()=>{role='host';$('code').textContent=q?'':code;$('link').textContent=q?'':location.origin+location.pathname+'?r='+code;st(q?'Ждём второго игрока...':'Скажите код напарнику или отправьте ссылку. Ждём...')});
p.on('connection',c=>{if(conn){c.close();return}conn=c;wire(c)});
p.on('error',e=>{if(p!==peer)return;if(e.type=='unavailable-id'){if(q&&++qt<4)joinRoom2(code,true);else if(!q)hostRoom(rc(),false);else st('Не удалось найти игру, попробуйте ещё раз')}else st('Ошибка сети: '+e.type)})}
function joinRoom2(code,q){cleanNet();st('Подключаемся...');role='guest';const p=peer=new Peer(PCFG);
p.on('open',()=>{conn=p.connect('bic-'+code,{reliable:true});wire(conn)});
p.on('error',e=>{if(p!==peer)return;if(e.type=='peer-unavailable'){if(q&&++qt<4)hostRoom(code,true);else st(q?'Не удалось найти игру, попробуйте ещё раз':'Комната не найдена')}else st('Ошибка сети: '+e.type)})}
function wire(c){c.on('open',()=>{if(role=='guest')c.send({t:'hi',skin:ST.skin})});c.on('data',onData);c.on('close',()=>{if(c===conn)netLost()});c.on('error',()=>{if(c===conn)netLost()})}
function netLost(){const g=scr=='game';cleanNet();if(g)showEnd('lost');else st('Соединение потеряно')}
function onData(m){if(role=='host'){if(m.t=='hi'){startGame(2,m.skin);conn.send({t:'start',skin:ST.skin})}else if(m.t=='i'&&G&&G.pl[1]){if(m.d!==undefined)G.pl[1].inp=m.d;if(m.a)G.pl[1].act=1;if(m.b)G.pl[1].ab=1}else if(m.t=='c')bub('Напарник: '+PH[m.m])}
else if(role=='guest'){if(m.t=='start'){G=blank(2);G.guest=1;ld=-1;show(null)}else if(m.t=='s')applySnap(m);else if(m.t=='c')bub('Напарник: '+PH[m.m])}}
function quick(){qt=0;loadPeer(()=>hostRoom('QIK',true))}
function createRoom(){qt=0;loadPeer(()=>hostRoom(rc(),false))}
function joinRoom(){const c=$('ji').value.toUpperCase().trim();if(c.length!=3){st('Введите код из 3 символов');return}qt=0;loadPeer(()=>joinRoom2(c,false))}

let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
if(scr=='game'&&G){localInput();if(role=='guest'||G.guest)smooth(dt);else simulate(dt);parts(dt);
if(role=='host'){snapT+=dt;if(snapT>.05){snapT=0;sendSnap()}}
if(!G.guest&&G.state!='play'&&!G.shown){G.shown=1;if(role=='host')sendSnap();showEnd(G.state)}
render();hud()}else if(scr=='menu')menuScene(t/1000);if(fc++%20==0)fit();
requestAnimationFrame(loop)}
const lc=['#ff8fb8','#ffd23c','#6fd3ff','#9be36d'];let ti='',ci=0;
for(const ch of 'ПЛОХОЕ МОРОЖЕНОЕ'){if(ch==' ')ti+='<br>';else ti+='<span style="color:'+lc[ci%4]+';animation-delay:'+(ci++*.1)+'s">'+ch+'</span>'}
$('mt').innerHTML=ti;
show('menu');fit();requestAnimationFrame(loop);
const qr=new URLSearchParams(location.search).get('r');
if(qr&&qr.length==3){show('online');qt=0;loadPeer(()=>joinRoom2(qr.toUpperCase(),false))}
</script></body></html>
